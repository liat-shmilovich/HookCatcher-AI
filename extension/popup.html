<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <div id="logo-placeholder">🎣</div>
      <h1>HookCatcher AI</h1>
    </header>

    <div id="status-container" class="card">
      <div id="loader" class="hidden">
        <div class="spinner"></div>
        <p>Analyzing Email Content...</p>
      </div>
      
      <div id="result-area" class="hidden">
        <div id="shield-icon">🛡️</div>
        <h2 id="verdict-text">Safe</h2>
        <p id="summary-text"></p>
        
        <button id="details-btn">Show Full Analysis</button>
        <div id="details-panel" class="hidden">
          <hr>
          <p id="full-analysis"></p>
        </div>
        <button id="download-btn" class="secondary-btn">Download PDF Report</button>
      </div>

      <button id="scan-btn">Scan Current Email</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
