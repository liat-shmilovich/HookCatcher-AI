<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { width: 350px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 15px; background-color: #f4f7f9; direction: rtl; }
        h2 { color: #2c3e50; font-size: 18px; text-align: center; margin-top: 0; }
        .container { display: flex; flex-direction: column; gap: 10px; }
        button { background-color: #3498db; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: background-color 0.3s; }
        button:hover { background-color: #2980b9; }
        #status { font-size: 13px; color: #333; margin-top: 15px; white-space: pre-wrap; line-height: 1.4; border-top: 1px solid #ddd; padding-top: 10px; }
        .logo { text-align: center; font-size: 30px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="logo">🛡️</div>
    <h2>SOC Analyzer</h2>
    <div class="container">
        <button id="analyzeBtn">Analyze Current Email</button>
        <div id="status">מוכן לניתוח...</div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
